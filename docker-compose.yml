services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius
    volumes:
      - sirius_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sirius -d sirius']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-sirius.studio22@gmail.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-sirius.studio22@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Meriem Zahzouh}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Sirius Studio <noreply@sirius.studio>}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SEED_ON_START: ${SEED_ON_START:-true}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:8080/api}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
        VITE_ENABLE_DEMO_FIXTURES: "true"
    ports:
      - '8080:80'
    restart: unless-stopped
    depends_on:
      - api

volumes:
  sirius_pg:
